name: fieldsync
description: Offline-First Flutter Reference Architecture
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Device / Permissions
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  device_info_plus: ^11.5.0

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Local Database
  drift: ^2.34.2
  #sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.9.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # Logging
  logger: ^2.6.1

  # UUID
  uuid: ^4.5.1

  # Background Tasks
  workmanager: ^0.9.0+3

  # Environment Variables
  flutter_dotenv: ^6.0.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.6.0
  drift_dev: ^2.28.1
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - .env